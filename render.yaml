services:
  - type: web
    name: flashcard-backend
    env: node
    region: singapore  # Chọn region gần Việt Nam nhất
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true   # Render tự tạo giá trị ngẫu nhiên
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_Vgr0yxALtFu8@ep-red-fog-ayvzrzft.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require"
      - key: FRONTEND_URL
        sync: false           # Điền sau khi có Vercel URL
